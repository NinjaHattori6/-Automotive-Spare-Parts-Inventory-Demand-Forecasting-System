{% extends "base.html" %}
{% block title %}{{ action }} Purchase · AutoParts IQ{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-8"><div class="panel-card">
  <div class="d-flex justify-content-between align-items-center mb-4"><h1 class="h3 mb-0">{{ action }} Purchase</h1><a class="btn btn-outline-secondary" href="{{ url_for('purchases.index') }}">Back</a></div>
  <form method="post"><div class="row g-3">
    <div class="col-md-6"><label class="form-label">Supplier</label><select class="form-select" name="supplier_id" required><option value="">Select supplier</option>{% for supplier in suppliers %}<option value="{{ supplier.id }}">{{ supplier.supplier_name }}</option>{% endfor %}</select></div>
    <div class="col-md-6"><label class="form-label">Product</label><select class="form-select" name="product_id" required><option value="">Select product</option>{% for product in products %}<option value="{{ product.id }}">{{ product.product_name }}</option>{% endfor %}</select></div>
    <div class="col-md-4"><label class="form-label">Quantity</label><input class="form-control" type="number" min="1" name="quantity" required></div>
    <div class="col-md-4"><label class="form-label">Unit cost</label><input class="form-control" type="number" min="0" step="0.01" name="unit_cost" required></div>
    <div class="col-md-4"><label class="form-label">Status</label><select class="form-select" name="status"><option value="Pending">Pending</option><option value="Received">Received</option></select></div>
    <div class="col-md-6"><label class="form-label">Purchase date</label><input class="form-control" type="date" name="purchase_date"></div>
  </div><div class="d-flex justify-content-end gap-2 mt-4"><a class="btn btn-outline-secondary" href="{{ url_for('purchases.index') }}">Cancel</a><button class="btn btn-primary" type="submit">Save Purchase</button></div></form>
</div></div></div>
{% endblock %}
