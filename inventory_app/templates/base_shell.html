<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Inventory Forecasting{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
  <div class="container-fluid"><a class="navbar-brand fw-bold" href="{{ url_for('dashboard.index') }}">AutoParts IQ</a>
    {% if current_user %}<div class="d-flex align-items-center gap-3 text-white"><span>{{ current_user.username }} · {{ current_user.role }}</span><a class="btn btn-outline-light btn-sm" href="{{ url_for('auth.logout') }}">Logout</a></div>{% endif %}
  </div>
</nav>
{% block content %}{% endblock %}
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
