{% extends "base.html" %}
{% block title %}Register · AutoParts IQ{% endblock %}
{% block page_content %}<div class="auth-card"><h1 class="h3 mb-4">Create account</h1><form method="post"><input class="form-control mb-3" name="username" placeholder="Username" required><input class="form-control mb-3" type="email" name="email" placeholder="Email" required><input class="form-control mb-3" type="password" name="password" placeholder="Password (8+ characters)" required><input class="form-control mb-4" type="password" name="confirm_password" placeholder="Confirm password" required><button class="btn btn-primary w-100">Register</button></form><p class="text-muted mt-4 mb-0">Already registered? <a href="{{ url_for('auth.login') }}">Sign in</a></p></div>{% endblock %}
