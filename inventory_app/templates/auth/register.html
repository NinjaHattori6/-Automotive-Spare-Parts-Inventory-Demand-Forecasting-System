{% extends "base.html" %}
{% block title %}Register · AutoParts IQ{% endblock %}
{% block content %}
<div class="d-flex justify-content-center align-items-center min-vh-75">
  <div class="auth-card">
    <h1 class="h3 mb-4">Create account</h1>
    <form method="post">
      <div class="mb-3">
        <label for="username" class="form-label">Username</label>
        <input id="username" class="form-control" name="username" required>
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input id="email" class="form-control" type="email" name="email" required>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input id="password" class="form-control" type="password" name="password" minlength="8" required>
      </div>
      <div class="mb-4">
        <label for="confirm_password" class="form-label">Confirm password</label>
        <input id="confirm_password" class="form-control" type="password" name="confirm_password" minlength="8" required>
      </div>
      <button class="btn btn-primary w-100">Register</button>
    </form>
    <p class="text-muted mt-4 mb-0">Already have an account? <a href="{{ url_for('auth.login') }}">Sign in</a></p>
  </div>
</div>
{% endblock %}
