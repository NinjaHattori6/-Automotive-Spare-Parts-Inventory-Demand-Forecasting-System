{% extends "base.html" %}
{% block title %}Login · AutoParts IQ{% endblock %}
{% block page_content %}<div class="auth-card"><h1 class="h3 mb-4">Welcome back</h1><form method="post"><label class="form-label">Username or email</label><input class="form-control mb-3" name="identifier" required autofocus><label class="form-label">Password</label><input class="form-control mb-4" type="password" name="password" required><button class="btn btn-primary w-100">Sign in</button></form><p class="text-muted mt-4 mb-0">New here? <a href="{{ url_for('auth.register') }}">Create an account</a></p></div>{% endblock %}
