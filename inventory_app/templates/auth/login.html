{% extends "base.html" %}
{% block title %}Login · AutoParts IQ{% endblock %}
{% block content %}
<div class="d-flex justify-content-center align-items-center min-vh-75">
  <div class="auth-card">
    <h1 class="h3 mb-4">Welcome back</h1>
    <form method="post">
      <div class="mb-3">
        <label for="identifier" class="form-label">Username or email</label>
        <input id="identifier" class="form-control" name="identifier" required autofocus>
      </div>
      <div class="mb-4">
        <label for="password" class="form-label">Password</label>
        <input id="password" class="form-control" type="password" name="password" required>
      </div>
      <button class="btn btn-primary w-100">Sign in</button>
    </form>
    <p class="text-muted mt-4 mb-0">New here? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
  </div>
</div>
{% endblock %}
